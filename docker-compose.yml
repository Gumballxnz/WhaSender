version: '3.8'

services:
  whasender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whasender
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
    volumes:
      - whasender_data:/app/data

volumes:
  whasender_data:
    name: whasender_data
